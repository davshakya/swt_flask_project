services:
  - type: web
    name: smart-water-tank
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --config flask_app/gunicorn.conf.py
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: smart-water-tank-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DB_FILE
        value: /var/data/tank.db
      - key: DB_BACKEND
        value: mysql
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: LOGIN_PASSWORD
        sync: false
      - key: SWT_DEVICE_KEYS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: TELEMETRY_HISTORY_ENABLED
        value: true
      - key: DATA_RETENTION_DAYS
        value: 7
      - key: MAX_TELEMETRY_ROWS_PER_DEVICE
        value: 65000
      - key: DEVICE_COMMAND_RETENTION_DAYS
        value: 7
      - key: OPS_ALERT_RETENTION_DAYS
        value: 30
      - key: OPS_AUDIT_RETENTION_DAYS
        value: 30
      - key: DB_MAINTENANCE_ENABLED
        value: true
      - key: DB_TARGET_SIZE_MB
        value: 256
      - key: DB_MAINTENANCE_MIN_INTERVAL_SECONDS
        value: 900
      - key: DB_WAL_AUTOCHECKPOINT_PAGES
        value: 1000
      - key: TEMP_DB_SIZE_GUARD_ENABLED
        value: true
      - key: TEMP_HARD_DB_CAP_ENABLED
        value: true
      - key: TEMP_HARD_DB_CAP_BATCH_ROWS
        value: 2000
      - key: TEMP_HARD_DB_CAP_MAX_BATCHES
        value: 24
      - key: REQUIRE_RENDER_PERSISTENT_DB
        value: true
      - key: SWT_DEVICE_SOURCE_MODE
        value: real
      - key: RESET_DEVICE_SOURCE_MODE_ON_BOOT
        value: true
      - key: SEED_VIRTUAL_DEVICE_ENVS
        value: false
      - key: PURGE_VIRTUAL_DEVICE_ENVS_ON_BOOT
        value: true
      - key: LOG_LEVEL
        value: warning
      - key: GUNICORN_ACCESS_LOG_ENABLED
        value: false
      - key: RELAY_VERIFY_TLS
        value: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: GUNICORN_THREADS
        value: 2
      - key: GUNICORN_MAX_REQUESTS
        value: 250
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: 25
