<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaleWell Home Automation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home_automation.css') }}">
  </head>
  <body>
    <main
      class="shell"
      data-cloud-enabled="{{ 'true' if cloud_enabled else 'false' }}"
      data-local-proxy="false"
      data-can-select-devices="{{ 'true' if can_select_devices else 'false' }}"
    >
      <header class="topbar">
        <div>
          <p class="eyebrow">SaleWell</p>
          <h1>Home Automation</h1>
          <p class="page-subtitle">Use your SaleWell account to control assigned appliances from local Wi-Fi or cloud.</p>
        </div>
        <div class="status-pill" id="connectionStatus">Checking</div>
      </header>

      <section class="device-directory">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Account devices</p>
            <h2>Boards linked to this login</h2>
          </div>
          <select id="registeredDeviceSelect" aria-label="Registered device"></select>
        </div>
        <div class="device-list" id="registeredDevices"></div>
      </section>

      <section class="control-strip">
        <div class="field">
          <label for="mode">Dashboard mode</label>
          <select id="mode">
            <option value="cloud" selected>Cloud dashboard</option>
            <option value="local">Local Wi-Fi dashboard</option>
          </select>
        </div>
        <div class="field grow">
          <label for="deviceId">Device ID</label>
          <input id="deviceId" value="{{ default_device_id }}" autocomplete="off" {% if not can_select_devices %}readonly{% endif %}>
        </div>
        <div class="field grow">
          <label for="localUrl">Local board URL</label>
          <input id="localUrl" value="{{ local_device_url }}" disabled>
        </div>
        <button class="icon-button" id="refreshButton" title="Refresh status" type="button">
          <span aria-hidden="true">R</span>
        </button>
      </section>

      <section class="summary-grid" aria-live="polite">
        <div class="metric">
          <span>Mode</span>
          <strong id="modeLabel">Local Wi-Fi</strong>
        </div>
        <div class="metric">
          <span>IP</span>
          <strong id="ipLabel">-</strong>
        </div>
        <div class="metric">
          <span>Signal</span>
          <strong id="rssiLabel">-</strong>
        </div>
        <div class="metric">
          <span>Fan</span>
          <strong id="fanLabel">0</strong>
        </div>
      </section>

      <section class="actions">
        <button id="allOnButton" type="button">All On</button>
        <button class="secondary danger-action" id="allOffButton" type="button">All Off</button>
      </section>

      <div class="section-heading appliance-heading">
        <div>
          <p class="eyebrow">Connected appliances</p>
          <h2>Switches on selected board</h2>
        </div>
      </div>
      <section class="channels" id="channels"></section>

      <section class="fan-panel">
        <div>
          <h2>Fan Speed</h2>
          <p id="fanSpeedText">Speed 0</p>
        </div>
        <input id="fanSpeed" type="range" min="0" max="5" value="0">
      </section>
    </main>

    <script id="homeAutomationDevices" type="application/json">{{ registered_devices|tojson }}</script>
    <script src="{{ url_for('static', filename='js/home_automation.js') }}"></script>
  </body>
</html>
