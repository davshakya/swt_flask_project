<style id="swt-global-theme-overrides">
/* Loaded after page styles so every Flask surface follows the same contrast rules. */
html{color-scheme:light dark;font-size:15px}
body{color:var(--text,#12303a)}
button,input,select,textarea{font:inherit}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
select,
textarea{
  background-color:var(--input-bg,var(--panel,#fff))!important;
  border-color:var(--line,rgba(19,78,94,.16))!important;
  color:var(--text,#12303a)!important;
  caret-color:var(--primary,#1389a5);
}
select option{
  background-color:var(--panel,#fff);
  color:var(--text,#12303a);
}
input::placeholder,textarea::placeholder{
  color:var(--muted,#5f7d86)!important;
  opacity:1;
}
input:disabled,select:disabled,textarea:disabled{
  color:var(--muted,#5f7d86)!important;
  opacity:.72;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text,#12303a)!important;
  box-shadow:0 0 0 1000px var(--input-bg,var(--panel,#fff)) inset!important;
  transition:background-color 9999s ease-out 0s;
}
.label,.summary-label,.detail-label,.info-label,.peer-diagnostic-label,
.form-group>label,.metric-label,.setting-label{
  color:var(--primary,#1389a5)!important;
}
.value,.summary-value,.detail-value,.info-value,.peer-diagnostic-value,
.statuscopy,.list-title,.activity-message{
  color:var(--text,#12303a);
}
.subvalue,.summary-note,.detail-note,.helper-text,.list-meta,.activity-meta{
  color:var(--muted,#5f7d86);
}
.result-dialog,[role="dialog"],dialog{
  background-color:var(--panel,#fff);
  border-color:var(--line,rgba(19,78,94,.16));
  color:var(--text,#12303a);
}
table{color:var(--text,#12303a)}
th{color:var(--muted,#5f7d86)}
code,pre{
  color:var(--text,#12303a);
  background-color:var(--list-bg,var(--panel,#fff));
}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary,#1389a5) 55%,transparent);outline-offset:2px}

@media (prefers-color-scheme:dark){
  body{color:var(--text,#e6f4f7)}
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
  select,
  textarea{
    background-color:var(--input-bg,var(--panel,#0b1a23))!important;
    border-color:var(--line,rgba(154,202,221,.18))!important;
    color:var(--text,#e6f4f7)!important;
  }
  select option{
    background-color:var(--panel,#0b1a23);
    color:var(--text,#e6f4f7);
  }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text,#e6f4f7)!important;
    box-shadow:0 0 0 1000px var(--input-bg,var(--panel,#0b1a23)) inset!important;
  }
  .label,.summary-label,.detail-label,.info-label,.peer-diagnostic-label,
  .form-group>label,.metric-label,.setting-label{
    color:var(--primary,#55c1dd)!important;
  }
  .value,.summary-value,.detail-value,.info-value,.peer-diagnostic-value,
  .statuscopy,.list-title,.activity-message{
    color:var(--text,#e6f4f7);
  }
  .subvalue,.summary-note,.detail-note,.helper-text,.list-meta,.activity-meta{
    color:var(--muted,#9fb7c0);
  }
  .result-dialog,[role="dialog"],dialog{
    background-color:var(--panel,#0b1a23);
    border-color:var(--line,rgba(154,202,221,.18));
    color:var(--text,#e6f4f7);
  }
}

/* The booking dialog deliberately combines a dark header with a light form.
   Keep those two surfaces independent from the page's preferred color scheme. */
.enquiry-modal .modal-panel[role="dialog"]{
  background:linear-gradient(180deg,#12323c 0%,#08252e 100%);
  border-color:rgba(157,220,232,.3);
  color:#f2fbfd;
}
.enquiry-modal .modal-header h2{
  color:#f2fbfd;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
}
.enquiry-modal .modal-panel .eyebrow{
  background:rgba(67,206,226,.14);
  color:#68d9ea;
}
.enquiry-modal .modal-close{
  background:#1d3d47;
  border-color:rgba(185,229,237,.24);
  color:#f2fbfd;
}
.enquiry-modal .modal-close:hover,
.enquiry-modal .modal-close:focus-visible{
  background:#28515d;
  color:#fff;
}
.enquiry-modal .enquiry-form{
  --text:#173238;
  --muted:#587078;
  --line:rgba(25,77,88,.18);
  --input-bg:#f8fcfa;
  background:rgba(244,249,248,.96);
  color:#173238;
}
.enquiry-modal .group label{
  color:#526d75;
}
.enquiry-modal .enquiry-form input,
.enquiry-modal .enquiry-form select,
.enquiry-modal .enquiry-form textarea{
  color-scheme:light;
  background-color:#f8fcfa!important;
  border-color:rgba(25,77,88,.18)!important;
  color:#173238!important;
  caret-color:#0d7f95;
  -webkit-text-fill-color:#173238!important;
}
.enquiry-modal .enquiry-form input::placeholder,
.enquiry-modal .enquiry-form textarea::placeholder{
  color:#667c82!important;
  -webkit-text-fill-color:#667c82!important;
}
.enquiry-modal .field-warning{
  color:#a52f47;
}
.enquiry-modal .banner.success{
  background:#e2f2eb;
  border-color:#acd9c6;
  color:#126847;
}
.enquiry-modal .banner.error{
  background:#f9e7ea;
  border-color:#e8b8c1;
  color:#982f43;
}
</style>
